# Миграции генерируются автогенерацией, руками не пишутся:
#   alembic revision --autogenerate -m "описание"
#   alembic upgrade head
#
# sqlalchemy.url здесь намеренно пустой: он берётся из INGEST_DATABASE_URL
# в alembic/env.py, чтобы не было двух источников правды о том, куда
# подключаться.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S