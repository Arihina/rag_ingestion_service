# OpenSearch под RAG с bge-m3 (1024-мерные векторы).
#
# Отличия от конфигурации под multilingual-e5-small (384 dim):
#   - heap 512m -> 2g
#   - явный лимит off-heap памяти под HNSW
#   - порты только на localhost

services:
  opensearch:
    image: opensearchproject/opensearch:3.5.0
    container_name: opensearch-rag
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=Opensearch1!
      - bootstrap.memory_lock=true

      # 512m хватало на 384-мерные векторы e5-small. С 1024 у bge-m3
      # и bulk пачками по несколько сотен документов упрёшься в потолок
      # и получишь circuit breaker посреди загрузки.
      # Прод: половина RAM ноды, но не выше ~31g — за этой границей
      # JVM теряет сжатые указатели, и heap работает хуже, а не лучше.
      - "OPENSEARCH_JAVA_OPTS=-Xms2g -Xmx2g"

      # HNSW-графы живут ВНЕ heap: этот лимит с -Xmx не связан,
      # его надо задавать отдельно. Считается от RAM контейнера.
      - knn.memory.circuit_breaker.limit=60%

      # Векторы грузятся в память лениво, по мере обращения к сегментам.
      - knn.cache.item.expiry.enabled=false

    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536

    # Без этого лимита контейнер съест всю RAM хоста, и circuit breaker,
    # который считает проценты, будет считать их от бесконечности.
    mem_limit: 8g

    ports:
      # С plugins.security.disabled=true открытый наружу 9200 — это
      # анонимный доступ на запись ко всему кластеру.
      - "127.0.0.1:9200:9200"
      - "127.0.0.1:9600:9600"

    volumes:
      - opensearch-data:/usr/share/opensearch/data

    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  dashboards:
    image: opensearchproject/opensearch-dashboards:3.5.0
    container_name: opensearch-dashboards-rag
    environment:
      - OPENSEARCH_HOSTS=["http://opensearch:9200"]
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    ports:
      - "127.0.0.1:5601:5601"
    depends_on:
      opensearch:
        condition: service_healthy

volumes:
  opensearch-data: