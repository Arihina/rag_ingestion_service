# Запуск: docker compose -f docker-compose.dev.yml up -d --build
# Все порты биндятся на 127.0.0.1 — наружу ничего не торчит.
#
# Веса моделей живут на volume docling-models, а не в образе.
# Пересборка образа их не трогает: docker compose build --no-cache
# перестаёт стоить полчаса и десятки гигабайт.

services:
  opensearch:
    image: opensearchproject/opensearch:3.5.0
    container_name: opensearch-rag
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=Opensearch1!
      - bootstrap.memory_lock=true
      # 512m хватало на e5-small; с 1024-мерными векторами bge-m3
      # и bulk-загрузкой пачками этого мало даже в деве.
      - "OPENSEARCH_JAVA_OPTS=-Xms2g -Xmx2g"
      # HNSW-графы живут вне heap — этот лимит отдельный,
      # и считается он от памяти контейнера, отсюда mem_limit ниже.
      - knn.memory.circuit_breaker.limit=60%
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    mem_limit: 8g
    ports:
      - "127.0.0.1:9200:9200"
      - "127.0.0.1:9600:9600"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  dashboards:
    image: opensearchproject/opensearch-dashboards:3.5.0
    container_name: opensearch-dashboards-dev
    environment:
      - OPENSEARCH_HOSTS=["http://opensearch:9200"]
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    ports:
      - "127.0.0.1:5601:5601"
    depends_on:
      opensearch:
        condition: service_healthy

  # Одноразовый: наполняет volume и завершается.
  # Повторный up видит уже скачанное и проходит мгновенно.
  docling-models-init:
    build:
      context: .
      args:
        DOCLING_BASE: ghcr.io/docling-project/docling-serve-cu128:v1.21.0
    container_name: docling-models-init
    user: "0"
    environment:
      HF_HOME: /models/hf
    entrypoint: ["/bin/bash", "-lc"]
    command: >
      set -e;
      docling-tools models download -o /models/docling layout tableformer;
      python -c "from transformers import AutoTokenizer;
                 AutoTokenizer.from_pretrained('BAAI/bge-m3')";
      chown -R 1001:0 /models
    volumes:
      - docling-models:/models
    restart: "no"

  docling:
    build:
      context: .
      args:
        DOCLING_BASE: ghcr.io/docling-project/docling-serve-cu128:v1.21.0
    container_name: docling-serve-dev
    environment:
      DOCLING_SERVE_ARTIFACTS_PATH: /models/docling
      HF_HOME: /models/hf
      DOCLING_DEVICE: cuda:0
      DOCLING_NUM_THREADS: "4"
      # UI на /ui: можно закинуть проблемный PDF руками и посмотреть,
      # что вернули layout и OCR, не гоняя пайплайн целиком.
      DOCLING_SERVE_ENABLE_UI: "true"
      DOCLING_SERVE_ENG_KIND: local
      # HF_HUB_OFFLINE намеренно не выставлен: модели RapidOCR под eslav
      # докачиваются в рантайме при первом OCR (см. README).
    ports:
      - "127.0.0.1:5001:5001"
    volumes:
      - docling-models:/models
    depends_on:
      docling-models-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5001/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  opensearch-data:
  docling-models: