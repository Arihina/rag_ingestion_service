# Запуск: docker compose -f docker-compose.dev.yml up -d
#
# Кастомный образ не нужен: EasyOCR и RapidOCR входят в docling-serve.
# Dockerfile можно удалить.
#
# Перед первым запуском ОДИН РАЗ на хосте:
#   mkdir -p /home/dodo/storage/docling-models
#   sudo chown -R 1001:0 /home/dodo/storage/docling-models
#   sudo chmod -R g+rwX /home/dodo/storage/docling-models

x-docling-image: &docling-image ghcr.io/docling-project/docling-serve-cu128:v1.21.0

services:
  opensearch:
    image: opensearchproject/opensearch:3.5.0
    container_name: opensearch-rag
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=Opensearch1!
      - bootstrap.memory_lock=true
      # 512m хватало на e5-small; с 1024-мерными векторами bge-m3 мало.
      - "OPENSEARCH_JAVA_OPTS=-Xms2g -Xmx2g"
      # HNSW-графы живут ВНЕ heap: лимит отдельный, считается
      # от памяти контейнера — отсюда mem_limit ниже.
      - knn.memory.circuit_breaker.limit=60%
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    mem_limit: 8g
    ports:
      - "127.0.0.1:9200:9200"
      - "127.0.0.1:9600:9600"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Порт 5437, а не штатный 5432: тот занят другим экземпляром Postgres на
  # хосте. Меняется порт САМОГО демона (-p), а не только публикация, чтобы
  # адрес был одинаковым и с хоста, и из сети compose — асимметрия вида
  # "localhost:5437 снаружи, postgres:5432 внутри" уже дважды стоила нам
  # времени на SELF_URL и presign-адресе.
  postgres:
    image: postgres:16-alpine
    container_name: postgres-rag
    command: ["postgres", "-p", "5437"]
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag_ingest
    ports:
      - "127.0.0.1:5437:5437"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # -U обязателен: без него pg_isready проверяется под пользователем
      # postgres, которого в этом образе с заданным POSTGRES_USER нет,
      # и healthcheck зелёный при неготовой базе.
      test: ["CMD-SHELL", "pg_isready -U rag -d rag_ingest -p 5437"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: redis-rag
    # appendonly: очередь RQ переживает рестарт контейнера. Без него
    # задачи, поставленные за последнюю минуту, теряются молча, а
    # документы остаются в pending навсегда.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Одна нода: master, volume, filer и S3-шлюз в одном процессе.
  # Разносить роли имеет смысл, только когда упрёмся.
  #
  # -dir общий для всех ролей, поэтому том один.
  # -s3.config задаёт identity: без него шлюз пускает анонимно.
  seaweedfs:
    image: chrislusf/seaweedfs:3.98
    container_name: seaweedfs-rag
    command:
      - server
      - -dir=/data
      - -master.volumeSizeLimitMB=1024
      # Явное число, а не 0: ноль означает 'посчитать по свободному
      # месту', и результат зависит от того, что вернёт ФС тома.
      - -volume.max=100
      - -filer
      - -s3
      - -s3.port=8333
      - -s3.config=/etc/seaweedfs/seaweedfs-s3.json
    ports:
      - "127.0.0.1:8333:8333"   # S3
      - "127.0.0.1:9333:9333"   # master UI
      - "127.0.0.1:8888:8888"   # filer
    volumes:
      - seaweedfs-data:/data
      # Монтируется КАТАЛОГ, а не файл. При bind-mount одиночного файла
      # Docker молча создаёт на его месте пустой каталог, если файла нет,
      # и weed падает с 'is a directory' — причём уже после того, как
      # master, volume и filer успешно поднялись, так что в общем логе
      # это выглядит как сбой всего сервиса.
      - ./deploy:/etc/seaweedfs:ro
    healthcheck:
      # 127.0.0.1, а НЕ localhost: /etc/hosts в alpine резолвит localhost
      # в ::1, а weed слушает только IPv4 — проверка не достучится до
      # работающего сервиса, контейнер повиснет unhealthy, и за ним не
      # поднимется всё, что ждёт service_healthy.
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9333/cluster/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  dashboards:
    image: opensearchproject/opensearch-dashboards:3.5.0
    container_name: opensearch-dashboards-dev
    environment:
      - OPENSEARCH_HOSTS=["http://opensearch:9200"]
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    ports:
      - "127.0.0.1:5601:5601"
    depends_on:
      opensearch:
        condition: service_healthy

  # Одноразовый: наполняет /models и завершается.
  #
  # command — СПИСОК с блочным скаляром. Строковый вариант ("command: >")
  # Compose разбивает по пробелам, и bash -c получает только первое слово.
  #
  # rapidocr ОБЯЗАТЕЛЕН, даже если работать будем на easyocr: docling-serve
  # на старте прогревает пайплайн с ДЕФОЛТНЫМИ опциями, а дефолтный движок —
  # auto, который выбирает RapidOCR. Без этих весов контейнер падает
  # с FileNotFoundError ещё до первого запроса.
  #
  # Русскую модель EasyOCR тянем отдельно: docling отключает докачку весов
  # в рантайме, когда задан artifacts_path (считает это офлайн-режимом),
  # а docling-tools кладёт только детектор и латиницу.
  docling-models-init:
    image: *docling-image
    container_name: docling-models-init
    user: "0"
    environment:
      HF_HOME: /models/hf
      HOME: /models/home
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -eux
        mkdir -p /models/docling /models/hf /models/home
        docling-tools models download -o /models/docling \
          layout tableformer easyocr rapidocr
        python - <<'PY'
        import easyocr
        easyocr.Reader(
            ["ru", "en"],
            model_storage_directory="/models/docling/EasyOcr",
            download_enabled=True,
            gpu=False,
        )
        PY
        # Не только токенизатор для чанкера, но и веса целиком: их же
        # использует процесс API, монтируя этот том. Иначе первый старт
        # сервиса потянул бы 2.3 ГБ из сети мимо всякого офлайн-режима.
        python -c "from huggingface_hub import snapshot_download; snapshot_download('BAAI/bge-m3')"
        chown -R 1001:0 /models
        echo "=== ИТОГ ==="
        du -sh /models/*
        ls -la /models/docling/EasyOcr || true
    volumes:
      - /home/dodo/storage/docling-models:/models
    restart: "no"

  docling:
    image: *docling-image
    container_name: docling-serve-dev
    environment:
      DOCLING_SERVE_ARTIFACTS_PATH: /models/docling
      HF_HOME: /models/hf
      HOME: /models/home
      DOCLING_DEVICE: cuda:0
      DOCLING_NUM_THREADS: "4"
      DOCLING_SERVE_ENABLE_UI: "true"
      DOCLING_SERVE_ENG_KIND: local
    ports:
      - "127.0.0.1:5001:5001"
    volumes:
      - /home/dodo/storage/docling-models:/models
    depends_on:
      docling-models-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5001/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Профиль app: обычный `up -d` поднимает ТОЛЬКО зависимости, а сервис и
  # воркер запускаются с хоста в venv. Для дева это быстрее во всём:
  # образ api весит ~6 ГБ из-за torch и собирается минутами, отладчик к
  # процессу в контейнере не подцепить, а перезапуск после правки моделей
  # всё равно полный. Контейнеры нужны для проверки самой сборки — тогда
  # `--profile app up -d --build`.
  api:
    profiles: ["app"]
    build:
      context: .
      target: api
    container_name: rag-ingest-api
    env_file: ingest.env
    environment:
      # Внутри сети compose всё по именам сервисов, не по localhost.
      INGEST_HOST: 0.0.0.0
      # Внутренний порт слушает 0.0.0.0, но НЕ публикуется на хост:
      # в сети compose до него дотягиваются воркеры, снаружи — никто.
      INGEST_INTERNAL_HOST: 0.0.0.0
      INGEST_DOCLING_URL: http://docling:5001
      INGEST_OPENSEARCH_URL: http://opensearch:9200
      INGEST_DATABASE_URL: postgresql+asyncpg://rag:rag@postgres:5437/rag_ingest
      INGEST_REDIS_URL: redis://redis:6379/1
      INGEST_S3_ENDPOINT_URL: http://seaweedfs:8333
      # В контейнере api и docling в одной сети — адреса совпадают.
      INGEST_S3_PRESIGN_ENDPOINT_URL: http://seaweedfs:8333
      HF_HOME: /models/hf
    ports:
      - "127.0.0.1:8011:8011"
    volumes:
      - /home/dodo/storage/docling-models:/models
      # Исходники томом — ради INGEST_RELOAD. В проде этой строки нет:
      # там работает код, который лёг в образ.
      - ./app:/srv/app:ro
    depends_on:
      opensearch: { condition: service_healthy }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      seaweedfs: { condition: service_healthy }
      docling: { condition: service_started }
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Модель НЕ держит: за векторами ходит в api:8000/embed.
  # Отсюда ни torch, ни проброса GPU.
  worker:
    profiles: ["app"]
    build:
      context: .
      target: worker
    env_file: ingest.env
    environment:
      INGEST_DOCLING_URL: http://docling:5001
      INGEST_OPENSEARCH_URL: http://opensearch:9200
      INGEST_DATABASE_URL: postgresql+asyncpg://rag:rag@postgres:5437/rag_ingest
      INGEST_REDIS_URL: redis://redis:6379/1
      INGEST_S3_ENDPOINT_URL: http://seaweedfs:8333
      INGEST_S3_PRESIGN_ENDPOINT_URL: http://seaweedfs:8333
      INGEST_SELF_URL: http://api:8012
    volumes:
      # Тот же том, что у api. Без него воркер крутил бы код, запечённый
      # в образ, пока api работает со свежим — расхождение молчаливое
      # и находится долго. Перечитывает код воркер только при рестарте:
      # docker compose restart worker
      - ./app:/srv/app:ro
    depends_on:
      api: { condition: service_started }
      redis: { condition: service_healthy }

volumes:
  opensearch-data:
  postgres-data:
  redis-data:
  seaweedfs-data: